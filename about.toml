# cargo-about: the licenses of the crates linked into the exe, for THIRD_PARTY_LICENSES.md in the release zip
# (build-release.ps1 runs `cargo about generate`). A crate under a license not listed here stops the release build
# until it is looked at. The order is the preference where a crate offers a choice.
accepted = [
    "MIT",
    "Apache-2.0",
    "Zlib",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "0BSD",
    "BSL-1.0",
    "CC0-1.0",
    "Unicode-3.0",
    "Unlicense",
    # Slint, the UI toolkit: GPL-3.0 or its own royalty-free license, which asks for the "Made with Slint" badge on the
    # download page (the README). cargo-about finds no text for it (a LicenseRef, shipped only by the slint crate
    # under LICENSES/), so it warns about every Slint crate and build-release.ps1 adds the text itself.
    "LicenseRef-Slint-Royalty-free-2.0",
]
targets = ["x86_64-pc-windows-msvc"]
ignore-build-dependencies = true
ignore-dev-dependencies = true

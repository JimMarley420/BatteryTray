# cargo-about: the licenses of the crates linked into the macOS app, for THIRD_PARTY_LICENSES.md in its bundle
# (macos/build.sh runs `cargo about generate` with this file). The same as ../about.toml, for the Mac's targets. A
# crate under a license not listed here stops the build until it is looked at. The order is the preference where a crate offers a choice.
accepted = [
    "MIT",
    "Apache-2.0",
    "Zlib",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "0BSD",
    "BSL-1.0",
    "CC0-1.0",
    "Unicode-3.0",
    "Unlicense",
]
targets = ["aarch64-apple-darwin", "x86_64-apple-darwin"]
ignore-build-dependencies = true
ignore-dev-dependencies = true

[package]
name = "batterytray-macos"
# The app's version is the root package's (Cargo.toml), which macos/build.sh writes into Info.plist
version = "0.0.0"
edition = "2021"
rust-version = "1.88"
license = "MIT"
publish = false
description = "BatteryTray's core as a static library for the macOS app (macos/BatteryTray)"

[lib]
path = "src/lib.rs"
crate-type = ["staticlib", "rlib"]

[dependencies]
batterytray = { path = "../.." }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

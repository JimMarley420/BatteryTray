[package]
name = "batterytray-macos"
version = "2.2.0"
edition = "2021"
rust-version = "1.88"
license = "MIT"
publish = false
description = "BatteryTray's core as a static library for the macOS app (macos/BatteryTray)"

[lib]
path = "src/lib.rs"
crate-type = ["staticlib", "rlib"]

[dependencies]
batterytray = { path = "../.." }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

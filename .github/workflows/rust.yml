name: Rust

on:
  push:
    paths: ["src/**", "ui/**", "examples/**", "Cargo.toml", "Cargo.lock", "build.rs", "rustfmt.toml", ".cargo/**", "app.ico", "app.manifest", ".github/workflows/rust.yml", ".github/scripts/**"]
  pull_request:
    paths: ["src/**", "ui/**", "examples/**", "Cargo.toml", "Cargo.lock", "build.rs", "rustfmt.toml", ".cargo/**", "app.ico", "app.manifest", ".github/workflows/rust.yml", ".github/scripts/**"]

permissions:
  contents: read

jobs:
  check:
    # The app is Windows-only; the runner has the MSVC tools and the Windows SDK (rc.exe) build.rs needs
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: rustup toolchain install stable --profile minimal --component clippy,rustfmt
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rust-${{ hashFiles('Cargo.lock') }}
      - name: Formatting
        run: cargo fmt --check
      - name: Lints
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Tests
        run: cargo test --locked

  clean-windows:
    # The release exe has to start on a Windows with nothing installed (see .cargo/config.toml). Server Core in a
    # container is one: it has no Visual C++ redistributable. The runner's Windows must match the image's.
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: rustup toolchain install stable --profile minimal
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rust-release-${{ hashFiles('Cargo.lock', '.cargo/config.toml') }}
      - name: Build
        run: cargo build --release --locked
      - name: The check catches an exe that needs the redistributable
        # 1.99.0 was built without the C runtime in it
        run: |
          curl.exe -sSfL -o "$env:RUNNER_TEMP\BatteryTray-1.99.0.exe" https://github.com/qu1ncky/BatteryTray/releases/download/v1.99.0/BatteryTray.exe
          .github/scripts/clean-windows.ps1 "$env:RUNNER_TEMP\BatteryTray-1.99.0.exe" -MustFail
      - name: The exe starts on a clean Windows
        run: .github/scripts/clean-windows.ps1 target/release/BatteryTray.exe
